services:
  postgres:
    image: postgres:16-alpine
    container_name: peersv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peersv
      POSTGRES_PASSWORD: peersv
      POSTGRES_DB: peersv
    ports:
      - "5433:5432"
    volumes:
      - peersv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peersv -d peersv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peersv-postgres-data:
